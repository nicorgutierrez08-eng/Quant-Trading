name: intraday-zoo

# Intraday model zoo on the 5-minute bars: which model and horizon has the
# largest gross edge (qtrade/research/intraday_zoo.py). One job per horizon,
# then a merge. Needs the DATA_KEY secret (the bars are stored encrypted).
# Results go to intraday/zoo/ on the "results" branch.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Most liquid N stocks"
        default: "500"
  push:                    # when the zoo itself changes on a working branch
    branches: ["claude/**"]
    paths: ["qtrade/research/intraday_zoo.py", ".github/workflows/intraday-zoo.yml"]

permissions:
  contents: write

concurrency:
  group: intraday-zoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        horizon: ["1", "3", "6", "12", "close"]
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space (the dataset is several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch 5-minute bars
        run: |
          source scripts/datastore.sh
          fetch_dataset intraday_5min intraday/5min || { echo "::error::No intraday_5min dataset"; exit 1; }
      - name: Run the zoo for this horizon
        run: |
          set -o pipefail
          mkdir -p parts
          python -m qtrade.research.intraday_zoo --store data/intraday/5min \
            --symbols "${{ inputs.symbols || '500' }}" --horizon "${{ matrix.horizon }}" --out parts \
            2>&1 | tee parts/run_h${{ matrix.horizon }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izoo-h${{ matrix.horizon }}
          path: parts

  merge:
    needs: horizon
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: izoo-h*
      - name: Merge
        run: |
          python -m qtrade.research.intraday_zoo --aggregate parts --out reports/intraday_zoo
          cat reports/intraday_zoo/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the results branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RES=$(mktemp -d)
          for attempt in 1 2 3 4 5; do
            rm -rf "$RES"; mkdir -p "$RES"; cd "$RES"; git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if git fetch -q --depth 1 origin results; then git checkout -q -B results FETCH_HEAD; else git checkout -q --orphan results; fi
            rm -rf intraday/zoo && mkdir -p intraday/zoo
            cp -r "$GITHUB_WORKSPACE/reports/intraday_zoo/." intraday/zoo/
            git add -A && git commit -q -m "Intraday model zoo (run ${{ github.run_id }})"
            if git push -q origin results; then echo "published intraday/zoo"; break; fi
            sleep $((attempt * 15))
          done
