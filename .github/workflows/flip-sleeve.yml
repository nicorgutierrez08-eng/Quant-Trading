name: flip-sleeve

# Nico's momentum flip as a sleeve of the simulated $10,000 sheet book
# (qtrade/intraday/flip_sleeve.py): once a day near the close the sleeve is marked to the
# latest prices and rebalanced in the Google Sheet's "Momentum flip" tab. Nothing is sent
# to Alpaca. The two crons cover 15:44 New York in both summer and winter time; the script
# itself only runs between 15:40 and midnight New York, once a day (a day already booked is skipped);
# after the close the latest price is the official close.

on:
  schedule:
    - cron: "44 19,20,21,22,23 * * 1-5"   # GitHub often fires late or skips: every hour until midnight UTC
  workflow_dispatch:
    inputs:
      force:
        description: "run now even outside 15:40-16:00 New York"
        default: "false"

permissions:
  contents: read

concurrency:
  group: flip-sleeve
  cancel-in-progress: false

jobs:
  sleeve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HFT_SHEET_ID: ${{ secrets.HFT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mark and rebalance the sleeve
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then F=--force; else F=; fi
          python -m qtrade.intraday.flip_sleeve $F
