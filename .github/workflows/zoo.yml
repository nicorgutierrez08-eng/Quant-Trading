name: model-zoo

# Hundreds of forecasting models on real data (qtrade/research/zoo.py), run as
# parallel jobs (model group x horizon) and merged into a report and
# best_correlations.csv under research/zoo/ on the "results" branch.
#
# A commit message can pick the jobs and add an earlier run's results:
#   [zoo: extra@1,5,21,63; simple,linear,tree,nn@63]   which jobs to run
#   [zoo-prev: 123456789]                               merge that run's results too
# Results from every merge are kept (research/zoo/parts), so later runs add to them.

on:
  push:
    branches: ["claude/**"]
    paths: ["qtrade/research/zoo.py", ".github/workflows/zoo.yml"]

permissions:
  contents: write
  actions: read     # download an earlier run's results

concurrency:
  group: zoo-${{ github.sha }}
  cancel-in-progress: false

env:
  DATA_KEY: ${{ secrets.DATA_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - name: Plan the jobs
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          msg = os.environ.get("MSG", "")
          m = re.search(r"\[zoo:\s*([^\]]+)\]", msg)
          spec = m.group(1) if m else "simple,linear,tree,nn,extra@1,5,21,63"
          jobs = []
          for part in spec.split(";"):
              groups, hs = part.strip().split("@")
              jobs += [{"group": g.strip(), "horizon": int(h)} for g in groups.split(",") for h in hs.split(",")]
          prev = re.search(r"\[zoo-prev:\s*(\d+)\]", msg)
          print("jobs=" + json.dumps(jobs))
          print("prev=" + (prev.group(1) if prev else ""))
          PY
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: prices-1000-15-2000-01-01-zoo-${{ github.run_id }}
          restore-keys: |
            zoo-data-
            prices-1000-15-2000-01-01-
      - name: Prices, universe, fundamentals and news
        run: |
          [ -f data/universe.csv ] || python -m qtrade universe
          python -m qtrade download
          source scripts/datastore.sh
          fetch_dataset fundamentals fundamentals || echo "no fundamentals"
          fetch_dataset news news || echo "no news"
          # free public data (macro, index changes, insider trades, short volume); cached between runs
          python -m qtrade.research.fetch_public || echo "public data partly unavailable"
          # daily statistics from the 5-minute bars (built once; the raw bars are too big to cache)
          if [ ! -f data/public/intraday_stats.parquet ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
            fetch_dataset intraday_5min intraday/5min && python -m qtrade.research.intraday_stats data/intraday/5min || echo "no intraday stats"
            rm -rf data/intraday
          fi
          du -sh data/*
      - name: Save data for the model jobs
        uses: actions/cache/save@v4
        with:
          path: data
          key: zoo-data-${{ github.run_id }}

  models:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: zoo-data-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Fit and score
        run: python -m qtrade.research.zoo --group ${{ matrix.group }} --horizon ${{ matrix.horizon }} --out zoo_part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoo-${{ matrix.group }}-h${{ matrix.horizon }}
          path: zoo_part

  aggregate:
    needs: [prep, models]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Results kept from earlier merges
        run: |
          mkdir -p zoo_parts/0_kept
          git fetch -q --depth 1 origin results || true
          for f in $(git ls-tree --name-only origin/results research/zoo/parts/ 2>/dev/null); do
            git show "origin/results:$f" > "zoo_parts/0_kept/$(basename "$f")"
          done
      - uses: actions/download-artifact@v4
        if: needs.prep.outputs.prev != ''
        with:
          pattern: zoo-*-h*
          path: zoo_parts/1_prev
          run-id: ${{ needs.prep.outputs.prev }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: zoo-*-h*
          path: zoo_parts/2_this
      - name: Merge
        run: |
          # later downloads win when the same model appears twice
          find zoo_parts/2_this -type f -exec touch {} +
          mkdir -p extra
          git fetch -q --depth 1 origin results && git show origin/results:research/latest/combos.csv > extra/combos.csv 2>/dev/null || rm -f extra/combos.csv
          python -m qtrade.research.zoo --aggregate zoo_parts --extra extra --out reports/zoo
          cat reports/zoo/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the results branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RES=$(mktemp -d)
          for attempt in 1 2 3 4 5; do
            rm -rf "$RES"; mkdir -p "$RES"; cd "$RES"; git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            if git fetch -q --depth 1 origin results; then git checkout -q -B results FETCH_HEAD; else git checkout -q --orphan results; fi
            rm -rf research/zoo && mkdir -p research && cp -r "$GITHUB_WORKSPACE/reports/zoo" research/zoo
            mkdir -p research/zoo/parts
            for d in 0_kept 1_prev 2_this; do                       # in this order, so newer results win
              [ -d "$GITHUB_WORKSPACE/zoo_parts/$d" ] && find "$GITHUB_WORKSPACE/zoo_parts/$d" -name 'zoo_*_h*.csv' -exec cp {} research/zoo/parts/ \;
            done
            git add -A && git commit -q -m "Model zoo (run ${{ github.run_id }})"
            if git push -q origin results; then echo published; break; fi
            sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zoo-report
          path: reports/zoo
