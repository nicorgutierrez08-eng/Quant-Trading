name: paper-trade

# Runs every weekday before the US open and sends market-on-open orders to
# your Alpaca *paper* account. GitHub's scheduler is best-effort (runs can be
# late or dropped), so it is scheduled twice; the second run skips itself if
# the first already traded. Nothing happens until you add two repository
# secrets (Settings -> Secrets and variables -> Actions):
#   ALPACA_API_KEY      ALPACA_SECRET_KEY
# from https://app.alpaca.markets (switch to the Paper account first).
# Run it by hand from the Actions tab with "send = false" to see the orders
# it would place without sending them.

on:
  schedule:
    - cron: "47 10 * * 1-5"   # 10:47 UTC = 6:47am New York (5:47am in winter)
    - cron: "17 12 * * 1-5"   # back-up: 8:17am New York (7:17am in winter)
  workflow_dispatch:
    inputs:
      send:
        description: "Send orders to the paper account (false = dry run)"
        type: boolean
        default: false
      config:
        description: "Config file for this run (empty = the QTRADE_CONFIG variable or the small account)"
        type: string
        default: ""

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    # one trader owns the account: TRADING_MODE = daily runs this one (auction is the default)
    if: github.event_name != 'schedule' || (vars.TRADING_MODE || 'auction') == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      # $10k multi-strategy book (stock book + ETF sleeves, half each) by default;
      # override with a repository variable QTRADE_CONFIG (e.g. config/small_account.yaml
      # for the stock book alone, config/default.yaml for the full 1000-name book)
      QTRADE_CONFIG: ${{ inputs.config || vars.QTRADE_CONFIG || 'config/multi_small_account.yaml' }}
    steps:
      - name: Check for Alpaca keys
        id: keys
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "No Alpaca secrets set - skipping. Add ALPACA_API_KEY and ALPACA_SECRET_KEY to enable paper trading."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.keys.outputs.ok == 'true'
      - name: Restore data cache
        if: steps.keys.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: data
          key: live-${{ github.run_id }}
          restore-keys: live-
      - name: Select universe (first run only)
        if: steps.keys.outputs.ok == 'true'
        run: '[ -f data/universe.csv ] || python -m qtrade universe'
      - name: Trade
        if: steps.keys.outputs.ok == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send }}" = "true" ]; then
            ONCE=""; [ "${{ github.event_name }}" = "schedule" ] && ONCE="--once-per-day"
            python -m qtrade ${QTRADE_CONFIG:+--config "$QTRADE_CONFIG"} paper --send $ONCE
          else
            python -m qtrade ${QTRADE_CONFIG:+--config "$QTRADE_CONFIG"} paper
          fi
      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.ok == 'true' && always()
        with:
          name: paper-trade-logs-${{ github.run_id }}
          path: logs
