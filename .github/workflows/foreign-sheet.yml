name: foreign-sheet

# Overnight persistence on Asian and European exchanges as a sleeve of the simulated $10,000 sheet
# book (qtrade/intraday/foreign_sheet.py): after the European closes (17:11 UTC), each open book
# is settled at the official open and each market that traded today opens tonight's book at its
# official close - in the sheet's "Foreign book" and "Foreign trades" tabs. Nothing goes to a broker.
# Then the foreign HFT tracker (qtrade/intraday/foreign_hft_sheet.py, $0 allocated) logs the day's
# minute-level trades in the "Foreign HFT tracker" tab.

on:
  schedule:
    - cron: "11 17,18,19,20,21 * * 1-5"   # GitHub often fires late or skips; a booked day is skipped
  workflow_dispatch:
    inputs:
      part:
        description: "both, or tracker (only the $0 HFT tracker - safe to run before Europe closes)"
        default: "both"

permissions:
  contents: read

concurrency:
  group: foreign-sheet
  cancel-in-progress: false

jobs:
  sleeve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      HFT_SHEET_ID: ${{ secrets.HFT_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: inputs.part != 'tracker'
        run: python -m qtrade.intraday.foreign_sheet
      - name: Foreign HFT tracker ($0 allocated)
        if: always()
        run: |
          git fetch -q --depth 1 origin results
          mkdir -p data
          git show origin/results:research/foreign/foreign_hft_rules.json > data/foreign_hft_rules.json
          python -m qtrade.intraday.foreign_hft_sheet
